# PowerKit plugin
set -g @plugin 'fabioluciano/tmux-powerkit'

# tmux-resurrect only; tmux-continuum's save hook and auto-restore don't
# survive powerkit, so save/restore are driven from the hooks at the bottom.
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Keep only the newest 10 snapshots: prune the rest after each save (resurrect has no built-in count cap)
set -g @resurrect-hook-post-save-all 'ls -1t $HOME/.local/share/tmux/resurrect/tmux_resurrect_*.txt 2>/dev/null | tail -n +11 | xargs -r rm -f'

# Basic configuration
# ping segment does a real 8.8.8.8 round trip (up to 2s on timeout) in the
# background render job every cache_ttl; dropped it since flicker tracked
# with system memory pressure making every powerkit fork+source cycle slower.
set -g @powerkit_plugins "battery,hostname,cpu,memory"
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_status_position "bottom"
set -g @powerkit_status_order "plugins,session"
set -g @powerkit_pane_border_lines "heavy"
# powerkit's own init (renderer.sh: configure_status_bar) re-applies
# status-interval from @powerkit_status_interval on every reload, stomping a
# raw `set status-interval` — so it must be set through its own option.
# Default (5s) matches its render-cache TTL, forking+re-sourcing the whole
# plugin (~10 bash files) every 5s; widened to cut fork frequency under the
# current memory-starved conditions.
set -g @powerkit_status_interval 15

set -g @powerkit_theme_variant "storm"
set -g window-active-style 'bg=terminal'

# Propagate login shell PATH to run-shell environment
run-shell 'tmux setenv -g PATH "$(zsh -c "echo \$PATH")"'

# options settings
set -s escape-time 0
set -g history-limit 50000

set -g aggressive-resize on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:usstyle"
set -g focus-events on

# Window name = task title that Claude Code sets on the pane (OSC 2).
# claude's process shows as claude or its version number (e.g. 2.1.3).
set -g automatic-rename on
set -g automatic-rename-format '#{?#{||:#{m:claude*,#{pane_current_command}},#{m:[0-9]*,#{pane_current_command}}},#{=/24/…:pane_title},#{pane_current_command}}'
set -g mouse on
set -g set-clipboard on

# source keybind
source $HOME/.config/tmux/keybind.conf

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# tmux-resurrect key bindings (must run after TPM loads the plugin).
# Manual save/restore as a safety net: prefix + C-s / prefix + C-r.
bind-key C-s run-shell '$HOME/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'
bind-key C-r run-shell '$HOME/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'

# Inject SSH server IP into powerkit status line.
# `##` is not a typo: run-shell format-expands its command string first, so
# `##(`/`##{` reach the status line as the `#(`/`#{` it needs.
# Skipped when already present, since powerkit only recomposes status-format[0]
# on init and a reload would otherwise prepend a second copy.
run-shell 'fmt=$(tmux show -gv "status-format[0]"); case "$fmt" in *ssh-status.sh*) ;; *) tmux set -g "status-format[0]" "#[fg=#7aa2f7,bg=#292e42,bold]##(~/.config/tmux/ssh-status.sh ##{q:session_name})#[default]${fmt}" ;; esac'

# Session save/restore driven by hooks, not by config-time jobs.
# A `run-shell -b` placed in this file runs while the server is still starting
# (the config is sourced before the initial session exists) and was observed to
# not run at all on a real `tmux` launch, while the identical config worked
# when sourced by hand — restore silently never happened. client-attached fires
# with the session, the config and the plugins all settled.
# Both scripts are idempotent — auto-restore.sh guards on a server-global
# option, auto-save.sh on a PID lock — so every later attach is a no-op.
# Both hooks are needed: a plain `tmux` fires session-created (and never
# client-attached, which only fires when a client attaches to a server that
# already exists), while `tmux attach` fires client-attached and never
# session-created. Registering both covers either way in.
set-hook -g session-created[50] 'run-shell -b "$HOME/.config/tmux/auto-restore.sh"'
set-hook -g session-created[51] 'run-shell -b "$HOME/.config/tmux/auto-save.sh"'
set-hook -g client-attached[50] 'run-shell -b "$HOME/.config/tmux/auto-restore.sh"'
set-hook -g client-attached[51] 'run-shell -b "$HOME/.config/tmux/auto-save.sh"'
